# 自动发版：推送 v* 标签时构建、签名并发布 GitHub Release。
# 需要的 secrets：
#   TAURI_SIGNING_PRIVATE_KEY — 更新包签名私钥（本地 ~/.tauri/wordpeek.key）
# 发版流程：git tag vX.Y.Z && git push origin vX.Y.Z
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 创建 Release 并上传附件
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成 Release 说明需要完整提交历史与标签

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 仓库直接向 main 推送（无 PR），GitHub 的 Release Notes API 只认合并的 PR，
      # 因此改为按上个标签以来的提交信息生成正文。
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            git log "$RANGE" --no-merges --pretty=format:'- %s'
            echo ""
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # 构建并创建 Release：自动上传安装包、便携 exe，
      # 且 bundle.createUpdaterArtifacts 开启时附带 .sig 签名和 latest.json 更新清单
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          # 上面的提交列表会被前置；generateReleaseNotes 再追加贡献者与 Full Changelog
          generateReleaseNotes: true
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      # 附加免安装便携版：构建产物里的裸 exe，解压即用/单文件直接跑（仅依赖系统 WebView2）
      - name: Upload portable exe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE="Wordpeek_${GITHUB_REF_NAME#v}_x64-portable.exe"
          cp src-tauri/target/release/wordpeek.exe "$FILE"
          gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber

  # macOS 版：只出 dmg，挂到同一个 Release。
  # 不做更新包（createUpdaterArtifacts=false，见 tauri.macos.conf.json）——
  # macOS 自动更新要求 app 已签名+公证，未签名包更新后会被 Gatekeeper 拦。
  build-macos:
    needs: build # 等 Windows job 建好 Release，避免两个 job 抢着创建
    # 明确要 Apple Silicon：产物是 aarch64 dmg（macos-latest 可能随 GitHub 调整架构）
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tauri.macos.conf.json 会被自动合并：targets=app+dmg、icon.icns、不产出更新签名。
      # dmg 步骤（hdiutil）偶发失败，重试一次只重建 dmg。
      - name: Build dmg
        run: npm run tauri build || npm run tauri build -- --bundles dmg

      # 回归护栏：bundle 没签名/seal 不完整时，下载后的副本会被 Gatekeeper 判为
      # 「已被修改或已损坏」且右键打开也无效（详见 tauri.macos.conf.json 里 signingIdentity）
      - name: Verify code signature
        run: codesign --verify --deep --strict src-tauri/target/release/bundle/macos/Wordpeek.app

      - name: Upload dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/dmg/*.dmg --clobber
