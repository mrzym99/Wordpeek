[package]
name = "wordpeek"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.2.1"
tauri-plugin-updater = "2"      # 自动更新：检查/下载/验签/静默安装
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"     # 剪贴板读写
enigo = "0.2"     # 模拟键盘（Ctrl+C）
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
md-5 = "0.10"     # 百度翻译 API 签名
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi",
    "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
