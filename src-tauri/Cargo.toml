[package]
name = "wordpeek"
version = "1.0.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.2.1"
tauri-plugin-updater = "2"      # 自动更新：检查/下载/验签/静默安装
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"     # 剪贴板读写
enigo = "0.2"     # 模拟键盘（Ctrl+C）
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
md-5 = "0.10"     # 百度翻译 API 签名
hmac = "0.12"     # 腾讯云 TC3-HMAC-SHA256 签名
sha2 = "0.10"     # TC3 签名哈希
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
parking_lot = "0.12"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2"   # 禁止多开：第二次启动只唤醒已有实例
tauri-plugin-dialog = "2"   # 权限缺失时弹原生对话框（Rust 侧调用，前端不需要权限）

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading",
    "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"   # CGDisplay 抓屏 + CGImage 像素读取
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSGeometry", "NSArray", "NSString", "NSData", "NSDictionary",
] }
objc2-app-kit = { version = "0.3", features = ["NSScreen"] }   # NSScreen visibleFrame 工作区
objc2-vision = { version = "0.3", features = [
    "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest",
    "VNObservation", "VNTypes",
] }   # 本地离线 OCR（免 Key）

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
