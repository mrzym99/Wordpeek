[package]
name = "wordpeek"
version = "2.3.5"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]   # 本地裸 cargo build 必须 --features custom-protocol，否则窗口连 localhost:1420 白屏

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.2.1"
tauri-plugin-updater = "2"      # 自动更新：检查/下载/验签/静默安装
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"     # 剪贴板读写
enigo = "0.2"     # 模拟键盘（Ctrl+C）
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
md-5 = "0.10"     # 百度翻译 API 签名
hmac = "0.12"     # 腾讯云 TC3-HMAC-SHA256 签名
sha2 = "0.10"     # TC3 签名哈希
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
parking_lot = "0.12"
tokio = { version = "1", features = ["time", "process"] }   # 每源翻译超时兜底；deepl 源用 curl 子进程
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2"   # 禁止多开：第二次启动只唤醒已有实例
tauri-plugin-dialog = "2"   # 权限缺失时弹原生对话框（Rust 侧调用，前端不需要权限）

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading",
    # 透明弹窗关掉 Win11 系统圆角（DWM），圆角只留 CSS 一层
    "Win32_Graphics_Dwm",
    # 划词图标：低级鼠标钩子(Win32_System_LibraryLoader 取模块句柄) + UIA 读选区
    "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_Accessibility",
    # 启动时拆 stdout/stderr 死管道炸弹（sanitize_stdio）
    "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security",
    # 剪贴板序号检测与文本备份/恢复（platform/win_clipboard.rs）：
    # DataExchange=Open/Get/SetClipboardData 等，Memory=GlobalAlloc/GlobalSize，Ole=CF_* 常量
    "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole",
    # 钩子看门狗：GetLastInputInfo 检测钩子被静默摘除 + GetTickCount 时基
    "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation",
    # 启动 toast：注册 AUMID（NSIS 快捷键不带 AUMID，WinRT 通知找不到身份就静默失败）
    "Win32_System_Registry",
    "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"   # CGDisplay 抓屏 + CGImage 像素读取
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSGeometry", "NSArray", "NSString", "NSData", "NSDictionary", "NSProcessInfo",
] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSEvent", "block2", "NSWorkspace", "NSRunningApplication", "NSPasteboard"] }   # NSScreen 工作区 + NSEvent 全局鼠标监听 + NSPasteboard changeCount（剪贴板序号）
block2 = "0.6"           # NSEvent 监视器的 block
core-foundation = "0.10" # AX 返回的 CFString 转 String
objc2-vision = { version = "0.3", features = [
    "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest",
    "VNObservation", "VNTypes",
] }   # 本地离线 OCR（免 Key）

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

# dev 构建也给图像编解码热点开优化：默认 debug 下整屏 PNG 编码慢 20 倍以上，截图遮罩会明显卡顿。
# 只影响这些第三方 crate（release 本来就是 opt-level 3，不受影响），编译增量很小
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
